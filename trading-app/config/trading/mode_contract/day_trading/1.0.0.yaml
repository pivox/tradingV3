schema_version: '1.0.0'
mode_id: day_trading
mode_version: '1.0.0'
lifecycle:
  status: draft
  executable: false
  rationale: 'The identity and observed timeframes are frozen; #132/#191 evidence and operational approvals are absent.'
horizon:
  state: unresolved
  value: null
  unit: holding_horizon_policy
  source: 'product decision pending #132/#191 evidence'
  justification: 'Timeframe roles do not define a maximum holding horizon; no value is inferred from the modern mode name.'
session_policy:
  state: unresolved
  value: null
  unit: session_policy
  source: 'product decision pending #132/#191 evidence'
  justification: 'No authoritative trading-session restriction exists in the inspected source.'
timeframes:
  regime: ['4h']
  context: ['1h']
  trigger: ['15m']
  execution: ['15m', '5m', '1m']
cadence:
  evaluation:
    state: unresolved
    value: null
    unit: duration
    source: 'product decision pending #132/#191 evidence'
    justification: 'A mode-wide cadence is not defined by the legacy MTF source.'
  validity_window:
    state: unresolved
    value: null
    unit: duration
    source: 'product decision pending #132/#191 evidence'
    justification: 'Legacy entry-zone TTL is setup/execution behavior and is not promoted to a mode validity fact.'
risk:
  trade_budget:
    state: defined
    value: 5.0
    unit: percent_equity_per_trade
    source: 'config/app/trade_entry.regular.yaml:77-84'
    justification: 'Direct extraction of trade_entry.risk.fixed_risk_pct; it is a baseline, not a profitability claim.'
  daily_loss_cap:
    state: defined
    value: { percent_equity: 6.0, absolute_quote: 30.0, quote_currency: USDT }
    unit: compound_percent_equity_and_quote_per_day
    source: 'config/app/trade_entry.regular.yaml:77-84'
    justification: 'Direct extraction of trade_entry.risk.daily_max_loss_pct; mainnet writes remain prohibited.'
  max_concurrent_positions:
    state: defined
    value: 4
    unit: positions
    source: 'config/app/trade_entry.regular.yaml:77-84'
    justification: 'Direct extraction of trade_entry.risk.max_concurrent_positions.'
  mode_exposure_cap:
    state: unresolved
    value: null
    unit: percent_equity_notional
    source: 'product decision pending portfolio contract and #132/#191 evidence'
    justification: 'No unambiguous per-mode exposure cap exists; portfolio aggregate exposure remains portfolio-owned.'
leverage:
  state: unresolved
  value: null
  unit: leverage_multiple
  source: 'ownership review of config/app/trade_entry.regular.yaml:87-119'
  justification: 'The legacy exchange_cap mixes mode intent with exchange capability; the modern mode cap must be decided separately.'
order_policy:
  state: defined
  value: { margin_mode: isolated, preferred_type: limit }
  unit: policy
  source: 'config/app/trade_entry.regular.yaml:59-62'
  justification: 'Direct extraction of active default order type and margin mode; ambiguous legacy maker/taker fallback is not imported.'
compatible_setup_ids:
  - day_trading.trend_continuation.long
  - day_trading.trend_continuation.short
data_contract:
  required_inputs:
    - { kind: candles, timeframes: ['4h', '1h', '15m', '5m', '1m'], fields: [open, high, low, close, volume] }
  missing_data_policy: reject
governance:
  promotion:
    target_status: shadow
    conditions: ['#132 and #191 evidence attached', 'independent risk review approved', 'all unresolved constraints resolved']
    action: 'publish a new semantic version; never mutate this version in place'
  suspension:
    target_status: draft
    conditions: ['kill switch asserted', 'data contract breach', 'daily loss cap breached', 'evidence invalidated']
    action: 'reject new entries and preserve audit lineage'
  rollback:
    target_status: retired
    conditions: ['promotion regression', 'risk invariant breach', 'schema or provenance defect']
    action: 'pin the last approved version explicitly; no implicit fallback'
ownership_model: mode-contract-ownership-v1
provenance:
  - { path: timeframes.regime, source: 'src/MtfValidator/config/validations.regular.yaml:7-12', unit: timeframe, justification: '4h is the highest active context timeframe.' }
  - { path: timeframes.context, source: 'src/MtfValidator/config/validations.regular.yaml:7-12', unit: timeframe, justification: '1h is the lower active context timeframe.' }
  - { path: timeframes.trigger, source: 'src/MtfValidator/config/validations.regular.yaml:7-12', unit: timeframe, justification: '15m is the configured default execution/decision descent point.' }
  - { path: timeframes.execution, source: 'config/app/trade_entry.regular.yaml:125-147', unit: timeframe, justification: '15m is allowed and the source permits descent to 5m/1m.' }
  - { path: data_contract.required_inputs, source: 'src/MtfValidator/config/validations.regular.yaml', unit: OHLCV_fields_by_timeframe, justification: 'The active validation rules consume candle-derived indicators across the declared roles.' }
  - { path: compatible_setup_ids, source: 'GitHub issue #300 catalog for #301', unit: setup_id, justification: 'Stable IDs only; setup definitions remain owned by #301.' }
