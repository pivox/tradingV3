schema_version: '1.0.0'
mode_id: swing
mode_version: '1.0.0'
lifecycle:
  status: shadow
  executable: true
  rationale: 'Backtest and research shadow only; the canonical campaign and the guarded 2026 holdout of the swing breakout candidate remain pending.'
horizon:
  state: defined
  value: { maximum_duration: PT336H, daily_boundary_time: '00:00:00', daily_boundary_timezone: UTC, close_before_boundary: false }
  unit: holding_horizon_policy
  source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11'
  justification: 'A swing position may live at most fourteen days; the UTC daily boundary only delimits accounting days and never closes a position.'
session_policy:
  state: defined
  value: { calendar: continuous_crypto, timezone: UTC }
  unit: session_policy
  source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11'
  justification: 'Crypto evaluation is continuous and all daily accounting is in UTC.'
timeframes:
  regime: ['4h']
  context: ['4h']
  trigger: ['4h']
  execution: ['4h']
  confirmations: ['4h']
cadence:
  evaluation:
    state: defined
    value: PT4H
    unit: duration
    source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11'
    justification: 'The setup is evaluated at every 4h close.'
  validity_window:
    state: defined
    value: PT4H
    unit: duration
    source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11'
    justification: 'A decision is never carried into the next 4h evaluation.'
risk:
  trade_budget:
    state: defined
    value: 5.0
    unit: percent_equity_per_trade
    source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11'
    justification: 'The research risk budget of the day_trading screens; the 250 quote environment cap binds first.'
  daily_loss_cap:
    state: defined
    value: { percent_equity: 100.0, absolute_quote: 100000.0, quote_currency: USDT, day_timezone: UTC, day_boundary_local: '00:00:00', include_unrealized_loss: true }
    unit: compound_percent_equity_and_quote_per_day
    source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11'
    justification: 'The candidate was screened without a daily-loss rule; this explicit cap cannot bind with ten plans of 250 quote notional.'
  max_concurrent_positions:
    state: defined
    value: { limit: 10, include_pending_entries: true }
    unit: positions
    source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11'
    justification: 'One active plan per pair over the ten research pairs; a pending entry reserves its pair.'
  mode_exposure_cap:
    state: defined
    value: 100.0
    unit: percent_equity_notional
    source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11'
    justification: 'Aggregate swing notional is capped at the equity.'
leverage:
  state: defined
  value: 2.0
  unit: leverage_multiple
  source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11'
  justification: 'The research leverage cap of the day_trading screens; final leverage stays 1 at 250 quote notional.'
order_policy:
  state: defined
  value: { margin_mode: isolated, preferred_type: limit, market_fallback: false }
  unit: policy
  source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11'
  justification: 'Only isolated limit intent is admissible; a market fallback is forbidden.'
compatible_setup_ids:
  - swing.breakout.long
  - swing.breakout.short
data_contract:
  required_inputs:
    - { kind: candles, timeframes: ['4h', '1h', '15m', '5m', '1m'], fields: [open, high, low, close, volume] }
    - { kind: order_book, timeframes: ['1m'], fields: [best_bid, best_ask, spread_bps] }
  missing_data_policy: reject
governance:
  promotion:
    target_status: shadow
    conditions: ['canonical campaign eligible on training and validation', 'guarded 2026 holdout passed once', 'independent risk review approved']
    action: 'publish a new semantic version; never mutate this shadow version'
  suspension:
    target_status: draft
    conditions: ['kill switch asserted', 'data or cost contract breach', 'portfolio invariant breached']
    action: 'reject new entries and preserve complete lineage'
  rollback:
    target_status: retired
    conditions: ['holdout failure', 'schema or provenance defect', 'risk invariant breach']
    action: 'retire this exact version; no implicit fallback'
ownership_model: mode-contract-ownership-v1
provenance:
  - { path: horizon, source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11', unit: holding_horizon_policy, justification: 'PT336H without a daily close.' }
  - { path: session_policy, source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11', unit: session_policy, justification: 'Continuous crypto session with UTC accounting.' }
  - { path: timeframes, source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11', unit: timeframe_roles, justification: 'Every rule role runs on the 4h timeframe.' }
  - { path: cadence, source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11', unit: duration, justification: 'Evaluation and validity are both PT4H.' }
  - { path: risk, source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11', unit: canonical_risk_policy, justification: 'Ten plans, one per pair, with a non-binding daily cap.' }
  - { path: leverage, source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11', unit: leverage_multiple, justification: '2x mode cap, final leverage 1.' }
  - { path: order_policy, source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11', unit: policy, justification: 'Isolated limit-only intent.' }
  - { path: compatible_setup_ids, source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11', unit: setup_id, justification: 'The two sides of the frozen breakout candidate.' }
  - { path: data_contract.required_inputs, source: 'docs/superpowers/plans/2026-10-11-swing-canonical-campaign.md owner decision 2026-10-11', unit: required_market_data, justification: 'Research candles of every timeframe and a live book at entry are fail-closed inputs.' }
