schema_version: '1.0.0'
mode_id: scalping
mode_version: '1.0.0'
lifecycle: { status: draft, executable: false, rationale: 'Observed behavior is catalogued, but #132/#191 evidence and operational approvals are absent.' }
horizon: { state: unresolved, value: null, unit: holding_horizon_policy, source: 'product decision pending #132/#191 evidence', justification: 'Timeframe roles do not define a maximum holding horizon; no value is inferred from the modern mode name.' }
session_policy: { state: unresolved, value: null, unit: session_policy, source: 'product decision pending #132/#191 evidence', justification: 'No authoritative session policy exists in source.' }
timeframes:
  regime: ['1h']
  context: ['15m']
  trigger: ['5m']
  execution: ['5m', '1m']
cadence:
  evaluation: { state: unresolved, value: null, unit: duration, source: 'product decision pending #132/#191 evidence', justification: 'The source defines timeframe selection, not a mode-wide scheduler cadence.' }
  validity_window: { state: unresolved, value: null, unit: duration, source: 'product decision pending #132/#191 evidence', justification: 'No authoritative mode validity window exists.' }
risk:
  trade_budget: { state: unresolved, value: null, unit: percent_equity_per_trade, source: 'config/app/trade_entry.scalper.yaml:26,73-78 and src/TradeEntry/Builder/TradeEntryRequestBuilder.php:80', justification: 'Active defaults request 7% while risk.fixed_risk_pct declares 2%; no modern value is selected without #132/#191 evidence.' }
  daily_loss_cap: { state: defined, value: { percent_equity: 6.0, absolute_quote: 40.0, quote_currency: USDT }, unit: compound_percent_equity_and_quote_per_day, source: 'config/app/trade_entry.scalper.yaml:71-80', justification: 'Direct extraction of both daily caps; mainnet writes remain prohibited.' }
  max_concurrent_positions: { state: defined, value: 6, unit: positions, source: 'config/app/trade_entry.scalper.yaml:71-80', justification: 'Direct extraction of risk.max_concurrent_positions.' }
  mode_exposure_cap: { state: unresolved, value: null, unit: percent_equity_notional, source: 'product decision pending portfolio contract and #132/#191 evidence', justification: 'No unambiguous per-mode cap exists; aggregate exposure remains portfolio-owned.' }
leverage: { state: unresolved, value: null, unit: leverage_multiple, source: 'ownership review of config/app/trade_entry.scalper.yaml:83-117', justification: 'Legacy exchange_cap is exchange-named and cannot silently become a mode-owned cap.' }
order_policy:
  state: defined
  value: { margin_mode: isolated, preferred_type: limit }
  unit: policy
  source: 'config/app/trade_entry.scalper.yaml:52-55'
  justification: 'Direct extraction of active default order type and margin mode; ambiguous maker/taker semantics are not imported.'
compatible_setup_ids:
  - scalping.trend_continuation.long
  - scalping.pullback.long
  - scalping.trend_momentum.short
data_contract:
  required_inputs:
    - { kind: candles, timeframes: ['1h', '15m', '5m', '1m'], fields: [open, high, low, close, volume] }
  missing_data_policy: reject
governance:
  promotion: { target_status: shadow, conditions: ['#132 and #191 evidence attached', 'independent risk review approved', 'all unresolved constraints resolved'], action: 'publish a new semantic version; never mutate this version in place' }
  suspension: { target_status: draft, conditions: ['kill switch asserted', 'data contract breach', 'daily loss cap breached', 'evidence invalidated'], action: 'reject new entries and preserve audit lineage' }
  rollback: { target_status: retired, conditions: ['promotion regression', 'risk invariant breach', 'schema or provenance defect'], action: 'pin the last approved version explicitly; no implicit fallback' }
ownership_model: mode-contract-ownership-v1
provenance:
  - { path: timeframes.regime, source: 'src/MtfValidator/config/validations.scalper.yaml:7-14', unit: timeframe, justification: '1h is the highest active context and therefore the regime role.' }
  - { path: timeframes.context, source: 'src/MtfValidator/config/validations.scalper.yaml:7-14', unit: timeframe, justification: '15m is the lower active context.' }
  - { path: timeframes.trigger, source: 'src/MtfValidator/config/validations.scalper.yaml:7-14', unit: timeframe, justification: '5m is the configured execution default and trigger descent point.' }
  - { path: timeframes.execution, source: 'src/MtfValidator/config/validations.scalper.yaml:7-14', unit: timeframe, justification: '5m and 1m are the explicit active execution timeframes.' }
  - { path: data_contract.required_inputs, source: 'src/MtfValidator/config/validations.scalper.yaml', unit: OHLCV_fields_by_timeframe, justification: 'The active validation rules consume candle-derived indicators across the declared roles.' }
  - { path: compatible_setup_ids, source: 'GitHub issue #300 catalog for #301', unit: setup_id, justification: 'Stable IDs only; setup definitions remain owned by #301.' }
