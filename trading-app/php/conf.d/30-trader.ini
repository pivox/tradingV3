extension=trader

; php-trader rounds every result to this many decimals (default 3, HALF_DOWN).
; At 3 decimals the ATR of a pair priced under 0.01 USDT rounds to 0, which
; AtrCalculator treats as invalid: one warning per evaluation, then the PHP
; fallback. Mid-priced pairs kept only one or two significant digits.
trader.real_precision=12
